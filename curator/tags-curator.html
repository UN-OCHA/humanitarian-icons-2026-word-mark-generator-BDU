<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Icon Tags Curator</title>
<style>
  :root {
    --blue: #009edb;
    --grey-light: #f2f2f2;
    --grey-mid: #666;
    --green: #4caf50;
    --orange: #ff9800;
    --red: #e53935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #333; }

  header {
    background: var(--blue); color: white; padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  .header-actions { display: flex; gap: 0.75rem; align-items: center; }
  .header-actions button {
    padding: 0.5rem 1rem; border: none; border-radius: 4px;
    font-size: 0.85rem; cursor: pointer; font-weight: 500;
  }
  .btn-export { background: white; color: var(--blue); }
  .btn-export:hover { background: #e0e0e0; }
  .btn-stats { background: rgba(255,255,255,0.2); color: white; cursor: default; font-weight: 400; }

  .filters {
    padding: 0.75rem 2rem; background: white; border-bottom: 1px solid #e0e0e0;
    display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    position: sticky; top: 52px; z-index: 99;
  }
  .filters input {
    padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;
    font-size: 0.85rem; width: 250px;
  }
  .filters select {
    padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;
    font-size: 0.85rem;
  }
  .filter-btn {
    padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 4px;
    background: white; font-size: 0.8rem; cursor: pointer;
  }
  .filter-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem; padding: 1.5rem 2rem;
  }

  .card {
    background: white; border-radius: 8px; border: 2px solid #e0e0e0;
    padding: 1rem; display: flex; gap: 1rem; transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--blue); }
  .card.needs-review { border-color: var(--orange); }
  .card.reviewed { border-color: var(--green); }

  .card-icon {
    width: 64px; height: 64px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--grey-light); border-radius: 6px; padding: 8px;
  }
  .card-icon img { width: 48px; height: 48px; }

  .card-body { flex: 1; min-width: 0; }
  .card-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.15rem; }
  .card-family { font-size: 0.75rem; color: var(--grey-mid); margin-bottom: 0.5rem; }

  .tags-container { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; }
  .tag {
    display: inline-flex; align-items: center; gap: 0.25rem;
    background: #e3f2fd; color: #1565c0; padding: 0.2rem 0.5rem;
    border-radius: 12px; font-size: 0.75rem;
  }
  .tag .remove {
    cursor: pointer; font-weight: bold; color: #999;
    margin-left: 0.15rem; font-size: 0.85rem; line-height: 1;
  }
  .tag .remove:hover { color: var(--red); }

  .add-tag {
    display: flex; gap: 0.25rem;
  }
  .add-tag input {
    flex: 1; padding: 0.3rem 0.5rem; border: 1px solid #ddd;
    border-radius: 4px; font-size: 0.75rem; min-width: 0;
  }
  .add-tag input:focus { border-color: var(--blue); outline: none; }
  .add-tag button {
    padding: 0.3rem 0.5rem; background: var(--blue); color: white;
    border: none; border-radius: 4px; font-size: 0.75rem; cursor: pointer;
  }

  .status-badge {
    font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 8px;
    display: inline-block; margin-left: 0.5rem; font-weight: 500;
  }
  .status-badge.needs-review { background: #fff3e0; color: #e65100; }
  .status-badge.ok { background: #e8f5e9; color: #2e7d32; }
</style>
</head>
<body>

<header>
  <h1>Icon Tags Curator</h1>
  <div class="header-actions">
    <span class="btn-stats" id="stats"></span>
    <button class="btn-export" onclick="exportJSON()">Export tags.json</button>
  </div>
</header>

<div class="filters">
  <input type="text" id="search" placeholder="Search icons or tags…" oninput="render()" />
  <select id="familyFilter" onchange="render()">
    <option value="">All families</option>
  </select>
  <button class="filter-btn" id="filterAll" onclick="setFilter('all')">All</button>
  <button class="filter-btn" id="filterReview" onclick="setFilter('review')">Needs review</button>
  <button class="filter-btn active" id="filterOk" onclick="setFilter('all')">
    <!-- default -->
  </button>
</div>

<div class="grid" id="grid"></div>

<script>
let tagsData = {};
let filterMode = 'all'; // 'all' | 'review'

async function init() {
  const resp = await fetch('../tags.json');
  tagsData = await resp.json();
  populateFamilyFilter();
  updateStats();
  render();
}

function populateFamilyFilter() {
  const families = [...new Set(Object.values(tagsData).map(v => v.family).filter(Boolean))].sort();
  const sel = document.getElementById('familyFilter');
  families.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    sel.appendChild(opt);
  });
}

function needsReview(entry) {
  return !entry.tags || entry.tags.length < 3;
}

function updateStats() {
  const total = Object.keys(tagsData).length;
  const review = Object.values(tagsData).filter(needsReview).length;
  document.getElementById('stats').textContent = `${total} icons · ${review} need review`;
}

function setFilter(mode) {
  filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (mode === 'review') document.getElementById('filterReview').classList.add('active');
  else document.getElementById('filterAll').classList.add('active');
  render();
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const family = document.getElementById('familyFilter').value;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const entries = Object.entries(tagsData)
    .filter(([key, val]) => {
      if (family && val.family !== family) return false;
      if (filterMode === 'review' && !needsReview(val)) return false;
      if (search) {
        const haystack = [key, val.name, val.family, ...(val.tags || [])].join(' ').toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    })
    .sort((a, b) => a[1].name.localeCompare(b[1].name));

  entries.forEach(([key, val]) => {
    const review = needsReview(val);
    const card = document.createElement('div');
    card.className = `card ${review ? 'needs-review' : 'reviewed'}`;
    card.innerHTML = `
      <div class="card-icon">
        <img src="../svg/${key}.svg" alt="${val.name}" />
      </div>
      <div class="card-body">
        <div class="card-name">
          ${val.name}
          <span class="status-badge ${review ? 'needs-review' : 'ok'}">${review ? 'needs review' : `${val.tags.length} tags`}</span>
        </div>
        <div class="card-family">${val.family || 'Uncategorized'}</div>
        <div class="tags-container" id="tags-${key}"></div>
        <div class="add-tag">
          <input type="text" placeholder="Add tag…" id="input-${key}"
            onkeydown="if(event.key==='Enter'){addTag('${key}')}" />
          <button onclick="addTag('${key}')">+</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
    renderTags(key);
  });
}

function renderTags(key) {
  const container = document.getElementById(`tags-${key}`);
  if (!container) return;
  container.innerHTML = '';
  (tagsData[key].tags || []).forEach((tag, i) => {
    const el = document.createElement('span');
    el.className = 'tag';
    el.innerHTML = `${tag}<span class="remove" onclick="removeTag('${key}', ${i})">×</span>`;
    container.appendChild(el);
  });
}

function addTag(key) {
  const input = document.getElementById(`input-${key}`);
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  if (!tagsData[key].tags) tagsData[key].tags = [];
  if (!tagsData[key].tags.includes(val)) {
    tagsData[key].tags.push(val);
    renderTags(key);
    updateStats();
    // Update card border
    const card = input.closest('.card');
    if (!needsReview(tagsData[key])) {
      card.className = 'card reviewed';
      card.querySelector('.status-badge').className = 'status-badge ok';
      card.querySelector('.status-badge').textContent = `${tagsData[key].tags.length} tags`;
    }
  }
  input.value = '';
}

function removeTag(key, index) {
  tagsData[key].tags.splice(index, 1);
  renderTags(key);
  updateStats();
  render(); // re-render to update card states
}

function exportJSON() {
  // Build clean export: just key -> tags array
  const output = {};
  Object.entries(tagsData)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .forEach(([key, val]) => {
      output[key] = {
        name: val.name,
        family: val.family,
        tags: val.tags || []
      };
    });

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tags.json';
  a.click();
  URL.revokeObjectURL(url);
}

init();
</script>
</body>
</html>
